site_name: QBiome
site_description: Documentation du projet QGIS/QField pour les relevés naturalistes de terrain
site_author: Félix Hinckel — Ageona Cartographie
site_url: https://felixhinckel.github.io/QBiome/

docs_dir: docs
use_directory_urls: false

theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy

extra_css:
  - assets/extra.css

markdown_extensions:
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: Sur cette page
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.details
  - attr_list

nav:
  - Accueil: index.md
  - Déploiement: 02_acceder_au_projet.md
  - Préparation: 03_preparer_son_terrain.md
  - Utiliser QField: 04_utilisation_qfield.md
  - Saisie opportuniste: 05_saisie_opportuniste.md
  - Protocoles faune: 06_protocoles_faune.md
  - Phytosociologie: 07_releves_phytosociologiques.md
  - Habitats: 08_cartographie_habitats.md
  - Zones humides: 09_zones_humides_pedologie.md
  - Traitement: 10_traitement_donnees.md
